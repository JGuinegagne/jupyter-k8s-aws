{{/*
Default TLS options for every router on websecure: the NLB -> Traefik hop and anything else
that terminates at Traefik. TLS 1.3 only: on TLS 1.2 Traefik (Go) accepts CBC suites and
cannot restrict the handshake signature algorithms, signing with SHA-1 or SHA-224 for a client
that offers only those. Under TLS 1.3 Go negotiates only the three AEAD suites, and its
key-exchange groups (ML-KEM hybrids, X25519, P-256/384/521) need no pinning.

Traefik allows one TLSOption named "default" cluster-wide; it applies to every router that
names no other option, including the workspace IngressRoutes.
*/}}
apiVersion: traefik.io/v1alpha1
kind: TLSOption
metadata:
  name: default
  namespace: {{ .Values.namespace }}
spec:
  minVersion: VersionTLS13
