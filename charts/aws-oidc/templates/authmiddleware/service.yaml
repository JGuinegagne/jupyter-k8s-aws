{{- if .Values.authmiddleware.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: authmiddleware
  namespace: {{ .Values.namespace }}
  labels:
    app: authmiddleware
    component: auth
spec:
  type: ClusterIP
  selector:
    app: authmiddleware
    component: auth
  ports:
  - port: {{ include "defaulter.authmiddlewarePort" . }}
    targetPort: {{ include "defaulter.authmiddlewareScheme" . }}
    protocol: TCP
    name: {{ include "defaulter.authmiddlewareScheme" . }}
{{- end }}