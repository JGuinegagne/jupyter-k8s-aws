{{- if .Values.webApp.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: web-app
  namespace: {{ .Values.namespace }}
  labels:
    app: web-app
    component: web-app
spec:
  selector:
    app: web-app
  ports:
    - name: {{ include "defaulter.webAppPortName" . }}
      port: {{ include "defaulter.webAppPort" . }}
      targetPort: {{ include "defaulter.webAppPortName" . }}
      protocol: TCP
{{- end }}
