{{- if .Values.webApp.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-app
  namespace: {{ .Values.namespace }}
  labels:
    app: web-app
    component: web-app
spec:
  {{- if not (and .Values.webApp.keda.enabled (.Capabilities.APIVersions.Has "keda.sh/v1alpha1")) }}
  replicas: {{ .Values.webApp.replicas }}
  {{- end }}
  selector:
    matchLabels:
      app: web-app
  template:
    metadata:
      labels:
        app: web-app
        component: web-app
    spec:
      serviceAccountName: web-app
      {{- with .Values.webApp.nodeSelector | default .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.webApp.tolerations | default .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.webApp.affinity }}
      affinity:
        {{- toYaml .Values.webApp.affinity | nindent 8 }}
      {{- else }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: web-app
                topologyKey: kubernetes.io/hostname
      {{- end }}
      {{- with .Values.webApp.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: web-app
        image: {{ .Values.webApp.repository }}/{{ .Values.webApp.imageName }}:{{ .Values.webApp.imageTag }}
        imagePullPolicy: {{ .Values.webApp.imagePullPolicy }}
        ports:
        - containerPort: {{ include "defaulter.webAppPort" . }}
          name: {{ include "defaulter.webAppPortName" . }}
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: {{ include "defaulter.webAppPort" . | quote }}
{{- if and .Values.internalTls.enabled .Values.internalTls.webApp }}
        # The server re-reads these files on a poll and serves a renewed certificate without
        # a restart. That relies on the kubelet updating the Secret volume, so it must stay a
        # whole-volume mount: a subPath mount is never updated.
        - name: TLS_CERT_FILE
          value: /etc/web-app/tls/tls.crt
        - name: TLS_KEY_FILE
          value: /etc/web-app/tls/tls.key
{{- end }}
        - name: NAMESPACE
          value: {{ .Values.webApp.workspacesDefaultNamespace | quote }}
        - name: STATIC_DIR
          value: "./dist"
        - name: SESSION_COOKIE_NAME
          value: {{ .Values.webApp.session.cookieName | quote }}
        - name: SESSION_COOKIE_PATH
          value: {{ .Values.webApp.session.cookiePath | quote }}
        - name: SESSION_COOKIE_MAX_AGE_SECS
          value: {{ include "defaulter.sessionCookieMaxAgeSecs" . | quote }}
        - name: SESSION_MAX_LIFETIME_SECS
          value: {{ include "defaulter.sessionMaxLifetimeSecs" . | quote }}
        - name: SESSION_NEAR_EXPIRY_THRESHOLD_SECS
          value: {{ include "defaulter.sessionNearExpiryThresholdSecs" . | quote }}
        - name: SESSION_SECRET_NAME
          value: {{ .Values.webApp.session.secretName | quote }}
        - name: SESSION_SECRET_NAMESPACE
          value: {{ .Values.namespace | quote }}
        - name: SESSION_KEY_PREFIX
          value: "jwt-signing-key-"
        - name: SESSION_NEW_KEY_USE_DELAY_SECS
          value: {{ .Values.webApp.session.newKeyUseDelaySecs | quote }}
        - name: SESSION_EXPECTED_DOMAIN
          value: {{ .Values.domain | quote }}
        {{- with .Values.webApp.workspaceNamespaceSelection.additionalNamespaces }}
        # Additional workspace namespaces; the server always unions in NAMESPACE
        # (workspacesDefaultNamespace), so it's not repeated here.
        - name: WORKSPACE_NAMESPACES
          value: {{ join "," . | quote }}
        {{- end }}
        - name: WORKSPACE_NAMESPACE_LABEL_SELECTOR
          value: {{ .Values.webApp.workspaceNamespaceSelection.labelSelector | quote }}
        - name: NAMESPACE_CANDIDATE_CAP
          value: {{ .Values.webApp.workspaceNamespaceSelection.candidateCap | quote }}
        - name: NAMESPACE_VISIBLE_PERSIST_CAP
          value: {{ .Values.webApp.workspaceNamespaceSelection.visiblePersistCap | quote }}
        - name: NAMESPACE_POLL_INTERVAL_SECS
          value: {{ .Values.webApp.workspaceNamespaceSelection.pollIntervalSecs | quote }}
        - name: SHARED_TEMPLATE_NAMESPACE
          value: {{ .Values.webApp.sharedNamespace | quote }}
        - name: LOG_LEVEL
          value: {{ .Values.webApp.logLevel | quote }}
        {{- if .Values.webApp.clusterAccess.clusterName }}
        # Kubectl access page: clusterName gates the feature — empty means disabled
        - name: CLUSTER_NAME
          value: {{ .Values.webApp.clusterAccess.clusterName | quote }}
        - name: CLUSTER_API_SERVER
          value: {{ .Values.webApp.clusterAccess.apiServer | quote }}
        - name: CLUSTER_CA_CERT_BASE64
          value: {{ .Values.webApp.clusterAccess.caCertBase64 | quote }}
        - name: OIDC_ISSUER_URL
          value: "https://{{ .Values.domain }}/dex"
        - name: OIDC_CLIENT_ID
          value: {{ .Values.dex.kubernetesClientId | quote }}
        - name: OIDC_CLIENT_SECRET
          value: {{ include "defaulter.oauth2ProxyClientSecret" . }}
        - name: OIDC_CALLBACK_PORT
          value: {{ .Values.webApp.clusterAccess.oidcCallbackPort | default 9800 | quote }}
        {{- end }}
        resources:
          {{- toYaml .Values.webApp.resources | nindent 10 }}
{{- if and .Values.internalTls.enabled .Values.internalTls.webApp }}
        volumeMounts:
        - name: internal-tls
          mountPath: /etc/web-app/tls
          readOnly: true
{{- end }}
        livenessProbe:
          httpGet:
            path: /api/v1/health
            port: {{ include "defaulter.webAppPortName" . }}
{{- if and .Values.internalTls.enabled .Values.internalTls.webApp }}
            # kubelet does not verify the certificate on an HTTPS probe.
            scheme: HTTPS
{{- end }}
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/v1/health
            port: {{ include "defaulter.webAppPortName" . }}
{{- if and .Values.internalTls.enabled .Values.internalTls.webApp }}
            scheme: HTTPS
{{- end }}
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 1000
          capabilities:
            drop:
            - ALL
      securityContext:
        fsGroup: 1000
{{- if and .Values.internalTls.enabled .Values.internalTls.webApp }}
      volumes:
      - name: internal-tls
        secret:
          secretName: web-app-internal-tls
{{- end }}
{{- end }}
